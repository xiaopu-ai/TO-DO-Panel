<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', system-ui, sans-serif">
  <title>TO-DO Panel — 把 Mac 刘海变成随手可用的工作台</title>
  <desc>TO-DO Panel 品牌头图，右侧展示从 Mac 刘海展开的本地工作台界面。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090A0E"/><stop offset=".55" stop-color="#10131A"/><stop offset="1" stop-color="#08090C"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8DA2FF"/><stop offset=".5" stop-color="#B69CFF"/><stop offset="1" stop-color="#6DE0D2"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="62%"><stop offset="0" stop-color="#8C7CFF" stop-opacity=".27"/><stop offset="1" stop-color="#8C7CFF" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".58"/></filter>
  </defs>
  <rect width="1200" height="520" rx="32" fill="url(#background)"/>
  <rect x=".5" y=".5" width="1199" height="519" rx="31.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
  <ellipse cx="882" cy="258" rx="390" ry="310" fill="url(#glow)"/>
  <g transform="translate(72 76)">
