    <rect x="9" y="10" width="36" height="22" rx="11" fill="#050506" stroke="#fff" stroke-opacity=".18"/>
    <rect x="20" y="16" width="14" height="7" rx="3.5" fill="#F5F5F7"/>
    <circle cx="16" cy="38" r="3" fill="#8DA2FF"/><circle cx="27" cy="38" r="3" fill="#B69CFF"/><circle cx="38" cy="38" r="3" fill="#6DE0D2"/>
  </g>
  <text x="72" y="192" font-size="60" font-weight="760" letter-spacing="-2" fill="#F7F7F8">TO-DO Panel</text>
  <text x="74" y="235" font-size="22" font-weight="540" fill="#fff" fill-opacity=".72">把 Mac 刘海，变成随手可用的工作台。</text>
  <text x="74" y="271" font-size="15" fill="#fff" fill-opacity=".44">待办、随笔记、链接、录音与本机 AI 提醒，始终贴顶待命。</text>
